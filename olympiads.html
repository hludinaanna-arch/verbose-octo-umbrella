        .btn-login:hover { background-color: var(--primary-color); color: #fff; }

        const langToggle = document.getElementById('lang-toggle');

        function applyLanguage(lang) {
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if (translations[lang][key]) el.textContent = translations[lang][key];
            });
            document.querySelectorAll('[data-placeholder-key]').forEach(el => {
                const key = el.getAttribute('data-placeholder-key');
                if (translations[lang][key]) el.placeholder = translations[lang][key];
            });
            renderOlympiads(document.getElementById('olymp-search').value, lang);
            localStorage.setItem('site_lang', lang);
        }

        function renderOlympiads(query, lang) {
            const container = document.getElementById('olymp-container');
            const noResults = document.getElementById('no-results');
            container.innerHTML = '';
            
            const lowerQuery = query.toLowerCase().trim();
            
            // Map IDs to translation keys for titles/descriptions/dates/tags
            const idToKeyMap = {
                "vsosh": "1", "vysshaya-proba": "2", "mosh": "3", "spbu": "4", 
                "phystech": "5", "lomonosov": "6", "pvg": "7", "zvezda": "8", 
                "turgor": "9", "rosatom": "10"
            };

            const filtered = olympiadsData.filter(o => {
                if (!lowerQuery) return true;
                // Check if query matches any subject in the array
                return o.subjects.some(s => s.toLowerCase().includes(lowerQuery));
            });

            if (filtered.length === 0) {
                noResults.style.display = 'block';
            } else {
                noResults.style.display = 'none';
                filtered.forEach(o => {
                    const keyNum = idToKeyMap[o.id];
                    const card = document.createElement('a');
                    card.href = `olympiad-detail.html?id=${o.id}`;
                    card.className = 'olymp-card';
                    
                    card.innerHTML = `
                        <div class="olymp-info">
                            <h3 data-key="olymp_${keyNum}_title">${translations[lang][`olymp_${keyNum}_title`]}</h3>
                            <p data-key="olymp_${keyNum}_desc">${translations[lang][`olymp_${keyNum}_desc`]}</p>
                            <div class="tags">
                                ${getTagsForOlympiad(o.id, lang)}
                            </div>
                        </div>
                        <div class="olymp-date" data-key="olymp_date_${keyNum}">${translations[lang][`olymp_date_${keyNum}`]}</div>
                    `;
                    container.appendChild(card);
                });
            }
        }

                "pvg": ["tag_adventure", "tag_multidisciplinary"],
                "zvezda": ["tag_engineering", "tag_tech"],
                "turgor": ["tag_math", "tag_logic"],
                "rosatom": ["tag_nuclear", "tag_physics"]
            };
            const tags = tagsMap[id] || [];
            return tags.map(t => `<span class="tag" data-key="${t}">${translations[lang][t]}</span>`).join('');
        }

        document.getElementById('olymp-search').addEventListener('input', (e) => {
            renderOlympiads(e.target.value, currentLang);
        });

        langToggle.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'ru' : 'en';
            applyLanguage(currentLang);
            langToggle.style.transform = 'rotate(360deg)';
            setTimeout(() => langToggle.style.transform = 'rotate(0deg)', 300);
        });

        // Initial render
        applyLanguage(currentLang);
    </script>
</body>
</html>
